<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сброс пароля | EngUply</title>

    <meta
      name="description"
      content="Установите новый пароль для вашего аккаунта EngUply"
    />
    <meta name="robots" content="noindex, nofollow" />

    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta name="theme-color" content="#17181d" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="stylesheet" href="style.css" />

    <script src="js/lib/md5.min.js"></script>
    <script type="module" src="reset-password.js"></script>
    <style>
      :root {
        --primary: #f47b36;
        --primary-text: #d95d17;
        --primary-light: #ffad5c;
        --primary-dark: #d95b17;
        --primary-rgb: 244, 123, 54;
        --bg: #fff9f4;
        --card: #ffffff;
        --card-rgb: 255, 255, 255;
        --text: #2f2f35;
        --muted: #8a8f98;
        --border: #ffe2cb;
        --success: #22c55e;
        --danger: #ef4444;
        --danger-rgb: 239, 68, 68;
        --warning: #f59e0b;
        --radius: 16px;
        --shadow: 0 6px 24px rgba(244, 123, 54, 0.12);
        --shadow-hover: 0 10px 36px rgba(244, 123, 54, 0.20);

        /* Градиенты для кнопок */
        --btn-gradient: linear-gradient(135deg, #f47b36, #ff9a47);
        --btn-gradient-hover: linear-gradient(135deg, #ef6d2d, #ff8c38);
        --accent-gradient: linear-gradient(135deg, #d94d2d 0%, #f47b36 45%, #ffb45b 100%);
      }
      html.dark {
        --primary: #ff9a4d;
        --primary-text: var(--primary);
        --primary-light: #ffb86f;
        --primary-rgb: 255, 154, 77;
        --bg: #17181d;
        --card: #23252b;
        --card-rgb: 35, 37, 43;
        --text: #f5f6f8;
        --muted: #a3a7b1;
        --border: #353943;
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        --shadow-hover: 0 10px 36px rgba(0, 0, 0, 0.6);
        --danger-rgb: 239, 68, 68;

        /* Градиенты для кнопок в тёмной теме */
        --btn-gradient: linear-gradient(135deg, #ff9a4d, #ffb86f);
        --btn-gradient-hover: linear-gradient(135deg, #ff8c38, #ffa858);
        --accent-gradient: linear-gradient(135deg, #d94d2d 0%, #ff9a4d 45%, #ffb45b 100%);
      }
      body {
        background: var(--bg);
        padding: 2rem 1rem;
      }
      .reset-container {
        max-width: 440px;
        width: 100%;
        margin: 0 auto;
      }
      .reset-logo {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .reset-logo .logo {
        font-size: 3rem;
        font-weight: 800;
        color: var(--primary);
      }
      .reset-logo .logo span {
        color: var(--text);
      }
      .reset-title {
        text-align: center;
        margin-bottom: 2rem;
        color: var(--text);
      }
      .reset-title h2 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
        color: var(--text);
      }
      .reset-title p {
        color: var(--muted);
        font-size: 1rem;
      }
      .form-group label {
        color: var(--text);
        font-weight: 600;
      }
      .input-with-icon {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .form-control {
        background: var(--bg);
        color: var(--text);
      }
      .btn-primary {
        background: var(--primary);
        color: white;
      }
      .btn-primary:hover {
        background: var(--primary-dark, var(--primary));
      }
    </style>
  </head>
  <body class="loading">
    <div class="reset-container">
      <div class="reset-logo">
        <div class="logo">Eng<span>Uply</span></div>
      </div>
      <div class="reset-title">
        <h2>
          <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 8px; color: var(--primary)">lock_reset</span>
          Установите новый пароль
        </h2>
        <p>Введите новый пароль для вашего аккаунта</p>
      </div>

      <form id="reset-password-form">
        <div class="form-group">
          <label style="color: var(--text); font-weight: 600">Новый пароль</label>
          <div class="input-with-icon">
            <span class="material-symbols-outlined input-icon">lock</span>
            <div class="password-field-wrapper">
              <input
                type="password"
                id="reset-new-password"
                class="form-control"
                placeholder="Минимум 8 символов: A-Z, a-z, 0-9, !@#$%"
                required
                autocomplete="new-password"
              />
              <button type="button" class="password-toggle" id="reset-new-password-toggle">
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label style="color: var(--text); font-weight: 600">Подтвердите пароль</label>
          <div class="input-with-icon">
            <span class="material-symbols-outlined input-icon">lock</span>
            <div class="password-field-wrapper">
              <input
                type="password"
                id="reset-confirm-password"
                class="form-control"
                placeholder="Повторите новый пароль"
                required
                autocomplete="new-password"
              />
              <button type="button" class="password-toggle" id="reset-confirm-password-toggle">
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>
        </div>
        <div id="reset-error" style="color: var(--danger); font-size: 0.85rem; font-weight: 700; min-height: 1.2rem; margin-bottom: 0.75rem"></div>
        <div id="reset-success" style="color: var(--success); font-size: 0.85rem; font-weight: 700; min-height: 1.2rem; margin-bottom: 0.75rem"></div>
        <button id="reset-submit-btn" type="submit" class="btn btn-primary btn-lg" style="width: 100%">
          <span class="material-symbols-outlined" style="margin-right: 8px">check</span>Сохранить пароль
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem">
        <a href="/login.html" style="color: var(--muted); text-decoration: none; font-size: 0.9rem">
          Вернуться на страницу входа
        </a>
      </div>
    </div>

    <div id="toast-box"></div>
  </body>
</html>
